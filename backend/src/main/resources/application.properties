server.port=8080

app.jwt.secret=${JWT_SECRET:change-this-secret-key-minimum-32-characters-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.google.client-id=${GOOGLE_CLIENT_ID:906219350638-p6fcn2ibj1hh9p40bib9r5l8tli5ubv1.apps.googleusercontent.com}
app.google.dev-token=${GOOGLE_DEV_TOKEN:dev-google-token}

app.upload-dir=${UPLOAD_DIR:uploads}
app.ocr.provider=${OCR_PROVIDER:mock}
