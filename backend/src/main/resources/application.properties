spring.profiles.active=local

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/invoice_ocr?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

server.port=8080

app.jwt.secret=${JWT_SECRET:change-this-secret-key-minimum-32-characters-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.google.client-id=${GOOGLE_CLIENT_ID:906219350638-p6fcn2ibj1hh9p40bib9r5l8tli5ubv1.apps.googleusercontent.com}
app.google.dev-token=${GOOGLE_DEV_TOKEN:dev-google-token}

app.upload-dir=${UPLOAD_DIR:uploads}
app.ocr.provider=${OCR_PROVIDER:groq}

app.openai.key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}

app.gemini.key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

app.groq.key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}

# Spring Mail SMTP Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

