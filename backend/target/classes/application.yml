spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/invoice_ocr_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:invoice_user}
    password: ${DB_PASSWORD:invoice_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-minimum-32-characters-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
    dev-token: ${GOOGLE_DEV_TOKEN:dev-google-token}
  upload-dir: ${UPLOAD_DIR:uploads}
  ocr:
    provider: ${OCR_PROVIDER:mock}
